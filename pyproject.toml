[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diorthosis"
version = "0.7.0"
description = "Compile published critical editions (PDF or OCR output) into TEI P5 with anchored apparatus, plus a deterministic AI-ready Markdown view"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Romain Girardi" }]
keywords = [
  "critical-edition", "apparatus-criticus", "TEI", "TEI-XML", "digital-humanities",
  "classics", "patristics", "ancient-greek", "latin", "textual-criticism",
  "ALTO", "hOCR", "markdown", "pdf",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "regreek>=0.7.2,<0.8",
  "pdfminer.six>=20231228",
]

[project.optional-dependencies]
# lxml powers the golden-harness checkers (tools/golden/); the package
# itself does not depend on it, but the harness tests exercise it in CI
dev = ["pytest>=8", "ruff>=0.5", "lxml>=5"]
# the review UI rasterizes page snippets; pypdfium2 is BSD/Apache
# (PyMuPDF's AGPL is deliberately avoided)
review = ["pypdfium2>=4", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/romain-girardi-eng/diorthosis"
Issues = "https://github.com/romain-girardi-eng/diorthosis/issues"
# the two contracts a consumer of this package depends on: the public Python
# surface, and what a release promises about it and about the emitted formats
Documentation = "https://github.com/romain-girardi-eng/diorthosis/blob/main/docs/api.md"
Changelog = "https://github.com/romain-girardi-eng/diorthosis/blob/main/docs/stability.md"

# The console entry point is FROZEN (docs/stability.md §1): the subcommand
# names, the option names and the four exit codes are the contract, not
# diorthosis.cli's Python shape.
[project.scripts]
diorthosis = "diorthosis.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diorthosis = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
