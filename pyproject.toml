[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diorthosis"
version = "0.5.0"
description = "Compile published critical editions (PDF or OCR output) into TEI P5 with anchored apparatus, plus a deterministic AI-ready Markdown view"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Romain Girardi" }]
keywords = [
  "critical-edition", "apparatus-criticus", "TEI", "TEI-XML", "digital-humanities",
  "classics", "patristics", "ancient-greek", "latin", "textual-criticism",
  "ALTO", "hOCR", "markdown", "pdf",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "regreek>=0.7.0",
  "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/romain-girardi-eng/diorthosis"
Issues = "https://github.com/romain-girardi-eng/diorthosis/issues"

[project.scripts]
diorthosis = "diorthosis.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diorthosis = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
